spring:
  application:
    name: GCFeed

  # 上传大视频需要放开 multipart 限制，否则会在进入 Controller 前被拒绝。
  # nginx 侧也要同步放开 client_max_body_size。
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB


  datasource:
    url: jdbc:mysql://localhost:3306/gcfeed?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password@mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${CR_REDIS_HOST:localhost}
      port: ${CR_REDIS_PORT:6379}
      password: ${CR_REDIS_PASSWORD:}
      database: ${CR_REDIS_DATABASE:0}

  rabbitmq:
    host: ${GCFEED_RABBITMQ_HOST:xxx.xxx.xx.xx}
    port: ${GCFEED_RABBITMQ_PORT:5672}
    username: ${GCFEED_RABBITMQ_USERNAME:gcfeed}
    password: ${GCFEED_RABBITMQ_PASSWORD:gcfeed@rabbitmq}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false

  # 计数刷库与对账共用调度线程池，避免长时间对账阻塞刷库
  task:
    scheduling:
      pool:
        size: 2

# GCFeed 业务配置
gcfeed:
  jwt:
    # 生产环境务必通过环境变量覆盖为强随机密钥（至少 32 字节）
    secret: ${GCFEED_JWT_SECRET:gcfeed-dev-only-secret-key-production-please-change-it}
    # 访问令牌有效期（秒），与 Go 版 access_ttl: 15m 一致
    access-ttl-seconds: 900
    issuer: gcfeed
  internal:
    # 内部服务调用令牌，对应请求头 X-Internal-Token
    token: ${GCFEED_INTERNAL_TOKEN:gcfeed-dev-only-internal-token}
  upload:
    # 上传文件存储根目录，相对进程工作目录
    root: ./uploads
  scheduling:
    enabled: true
  rabbitmq:
    enabled: true
    relay-interval-ms: 5000
    big-v-follower-threshold: 10000
    follower-batch-size: 500
    inbox-max-len: 1000
    outbox-max-len: 500
    backfill-limit: 100
    max-attempts: 3
  # 视频内容向量：本地哈希 n-gram 生成，供推荐召回使用
  embedding:
    # 向量维度。改维度等于换向量空间，必须同时换模型标识，否则新旧向量会互相覆盖
    dimension: 128
    # 补偿任务每批处理的视频数，以及单次任务最多跑多少批
    backfill-batch-size: 200
    backfill-max-batches: 20
    backfill-interval-ms: 600000
  # 推荐召回、用户画像和快照分页；以下时间窗口跨 scene 共用
  recommendation:
    # 首次查询召回的候选数上限（条），默认 500；配置范围 1～500，不是每页大小
    pool-limit: 500
    # 每次计算画像读取的最近 play / complete 流水数上限（条），默认 200
    profile-sample-limit: 200
    # 推荐排除近期已曝光视频的时间窗口（天），默认 7；包含窗口起点
    exposure-window-days: 7
    # 计算用户兴趣画像使用的观看流水时间窗口（天），默认 30
    profile-window-days: 30
    # 排序快照有效期（秒），默认 1800（30 分钟）；翻页不续期，过期需刷新首屏
    snapshot-ttl-seconds: 1800
    # 用户画像缓存有效期（秒），默认 300（5 分钟）；空画像也缓存，新行为最多延迟该时长生效
    profile-ttl-seconds: 300
  # 点赞、收藏计数最终一致：请求只记 Redis 增量，定时刷入 video_stat，再定期按 interaction_action 对账
  stat:
    flush-interval-ms: 2000
    flush-batch-size: 500
    reconcile-interval-ms: 1800000
    reconcile-initial-delay-ms: 60000
    reconcile-batch-size: 200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产环境请改为 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 监控端点：只暴露健康检查与 Prometheus 指标，避免泄露内部信息
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
    io.github.gmjneko.gcfeed: debug
